services:
  db:
    image: pgvector/pgvector:pg17
    volumes:
      - dev-data:/var/lib/postgresql/data
    # Dockers Default für /dev/shm sind 64 MB. Der HNSW-Aufbau über die
    # Chunk-Embeddings scheitert dann mit „could not resize shared memory
    # segment" — auf dem Server läuft pg-shared aus demselben Grund mit 1 GB.
    shm_size: 1g
    ports:
      # Nicht 5432 (knora, läuft parallel bis zum Abschaltkriterium aus
      # docs/KONZEPT.md) und nicht 5433 (Nachbarprojekt wv-db). Vor dem ersten
      # Start gegenprüfen:
      #   docker ps --format '{{.Names}}\t{{.Ports}}' | grep 543
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: prowiki
      POSTGRES_PASSWORD: prowiki-dev
      POSTGRES_DB: prowiki
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prowiki"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - devnet

  parser:
    build: ./parser
    # 8002 aus demselben Grund wie der DB-Port oben.
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./parser:/app
    environment:
      PORT: 8000
    restart: unless-stopped
    # Siehe docker-compose.yml: MarkItDown lädt große PDFs komplett in den RAM.
    mem_limit: 4g
    networks:
      - devnet

volumes:
  dev-data:

networks:
  devnet:
