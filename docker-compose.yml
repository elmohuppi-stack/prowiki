# Produktions-Stack für /var/www/prowiki auf nuernberg-16gb.
#
# Servicenamen tragen alle den Slug. Das ist keine Kosmetik: im geteilten Netz
# `apps-net` ist der Servicename ein **serverweiter** DNS-Alias. Am 8. August 2026
# hieß dieser Name in vier Stacks `app`; Dockers DNS gab reihum eine fremde
# Adresse zurück, und knoras Login endete nach zehn Sekunden mit einem 401 aus
# wandervogels Code. Details in platform/ARCHITEKTUR.md 6.1.
services:
  prowiki-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Kein Host-Port: prowiki-web proxyt /api/ intern über appnet.
    environment:
      DATABASE_URL: postgresql://${DB_USER:?DB_USER fehlt in .env}:${DB_PASSWORD:?DB_PASSWORD fehlt in .env}@pg-shared:5432/${DB_NAME:-prowiki}
      # Pflichtvariablen mit :? statt :- — ein fehlender Wert bricht den Start ab,
      # statt still auf einen Default zurückzufallen. Mit einem Default-Secret liefe
      # die App weiter, aber jeder mit Repo-Zugang könnte sich Sitzungen ausstellen.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET fehlt in .env}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL fehlt in .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      # Ohne das laufen die Sitzungscookies ohne Secure-Flag: useSecureCookies in
      # auth/index.ts hängt genau an dieser Variablen.
      NODE_ENV: production
      # Selbstregistrierung ist zu (platform/NEUE-APP.md 4.1). Für den einmaligen
      # Bootstrap der ersten Konten kurz auf 1, danach zurück.
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-0}
      # max_connections = 100 gilt für alle Apps zusammen; Richtwert für eine neue
      # App ist 5–10 (platform/ARCHITEKTUR.md 4.2).
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      PARSER_URL: http://prowiki-parser:8000/parse
      PORT: 3000
      # YouTube blockt Rechenzentrums-IPs; auf dem Server ist ein Transkript-Provider
      # zwingend, lokal nicht.
      YOUTUBE_TRANSCRIPT_PROVIDER: ${YOUTUBE_TRANSCRIPT_PROVIDER:-}
      APIFY_API_KEY: ${APIFY_API_KEY:-}
      SUPADATA_API_KEY: ${SUPADATA_API_KEY:-}
      # Was ein Transkriptabruf kostet, in Millionstel Euro. Hängt am gewählten
      # Apify-Actor; bei 300 Videos ist der Unterschied zwischen 0,01 € und
      # 0,05 € der Unterschied zwischen 3 € und 15 € (service/usage.ts).
      # LLM-Provider werden je Organisation eingetragen ("bring your own key",
      # service/provider.ts). Steht für eine Organisation keiner bereit, wird
      # standardmäßig **nicht** auf einen Plattform-Provider ausgewichen: wer
      # seinen eigenen Anbieter einträgt, weil er nicht in ein Drittland senden
      # will, darf nicht unbemerkt doch dort landen (docs/DRITTLAND-DEEPSEEK.md).
      # Auf 1 setzen, sobald es ein Kontingent-Angebot gibt.
      ALLOW_PLATFORM_PROVIDER: ${ALLOW_PLATFORM_PROVIDER:-0}
      TRANSCRIPT_COST_MICROS: ${TRANSCRIPT_COST_MICROS:-40000}
      SPOOL_DIR: /app/spool
      # Mailversand. Ohne SMTP_HOST landen Verifikations- und Reset-Links im
      # Log statt in einer Mail (backend/src/service/mail.ts) — das ist der
      # heutige Zustand und kein Fehler, aber ein vergessenes Passwort ist damit
      # nur mit SSH-Zugang zurücksetzbar.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # Durchgangsablage für hochgeladene Dateien. Die API schreibt hier hin,
      # prowiki-worker liest und löscht (backend/src/jobs/spool.ts). Ein Volume
      # und kein Bind-Mount: der Inhalt ist flüchtig und hat im
      # Repo-Verzeichnis nichts zu suchen.
      - prowiki-spool:/app/spool
    restart: unless-stopped
    # /health führt ein `select 1` gegen die Datenbank aus (src/index.ts): ein
    # hängender Prozess, der den Port noch hält, fällt sonst nicht auf.
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://localhost:3000/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Große Uploads werden mehrfach in den RAM kopiert (parseBody → arrayBuffer → Blob).
    # Der Deckel macht daraus einen kontrollierten Neustart dieses Containers statt
    # eines OOM-Kills bei einem beliebigen Nachbarn.
    mem_limit: 768m
    networks:
      # `- default` muss stehen: sobald ein Service networks: deklariert, verliert
      # er das Default-Netz und findet die eigenen Nachbardienste nicht mehr.
      - default
      - apps-net

  # Arbeitet die Job-Warteschlange ab: Datei- und URL-Importe, Chunking,
  # Embedding, Wiki-Generierung, Chat→Wiki. Dasselbe Bild wie prowiki-app, nur
  # ein anderer Einstiegspunkt.
  #
  # Warum getrennt vom API-Container: bis zum 21. August 2026 hingen diese
  # Arbeiten als `setTimeout` im API-Prozess und **jedes Deployment verlor
  # sie still** — `deploy.sh` macht ein `up --build`, und ein Import, der
  # gerade lief, war danach weg; das Dokument blieb auf `processing` stehen,
  # ohne Fehler, ohne Log. Ausführlich in backend/src/jobs/queue.ts.
  #
  # Kein Host-Port, kein apps-net-Alias-Konflikt, kein Healthcheck über HTTP:
  # der Prozess hört auf nichts. Ob er lebt, sagt der Warteschlangenstand.
  prowiki-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["bun", "run", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://${DB_USER:?DB_USER fehlt in .env}:${DB_PASSWORD:?DB_PASSWORD fehlt in .env}@pg-shared:5432/${DB_NAME:-prowiki}
      NODE_ENV: production
      # Eigener Prozess, eigener Pool. Kleiner als der der API: der Worker hat
      # keine gleichzeitigen Requests zu bedienen, sondern höchstens die
      # `localConcurrency` seiner Warteschlangen (jobs/queue.ts). Zusammen mit
      # der API bleibt prowiki so bei rund 14 Verbindungen von den 100, die
      # sich alle Apps auf pg-shared teilen (platform/ARCHITEKTUR.md 4.2).
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-4}
      JOBS_POOL_MAX: ${JOBS_POOL_MAX:-2}
      PARSER_URL: http://prowiki-parser:8000/parse
      SPOOL_DIR: /app/spool
      YOUTUBE_TRANSCRIPT_PROVIDER: ${YOUTUBE_TRANSCRIPT_PROVIDER:-}
      APIFY_API_KEY: ${APIFY_API_KEY:-}
      SUPADATA_API_KEY: ${SUPADATA_API_KEY:-}
      # LLM-Provider werden je Organisation eingetragen ("bring your own key",
      # service/provider.ts). Steht für eine Organisation keiner bereit, wird
      # standardmäßig **nicht** auf einen Plattform-Provider ausgewichen: wer
      # seinen eigenen Anbieter einträgt, weil er nicht in ein Drittland senden
      # will, darf nicht unbemerkt doch dort landen (docs/DRITTLAND-DEEPSEEK.md).
      # Auf 1 setzen, sobald es ein Kontingent-Angebot gibt.
      ALLOW_PLATFORM_PROVIDER: ${ALLOW_PLATFORM_PROVIDER:-0}
      TRANSCRIPT_COST_MICROS: ${TRANSCRIPT_COST_MICROS:-40000}
      # Hier ausdrücklich **nicht** auf 0: im Normalbetrieb kommt ein Import
      # nach dem anderen, und der Embedding-Job hat einen singletonKey je Wiki.
      # Der Grund für die 0 im tools-Profil sind Massenläufe, nicht der Betrieb.
      WIKI_EMBED_AFTER_GENERATE: ${WIKI_EMBED_AFTER_GENERATE:-1}
    volumes:
      - prowiki-spool:/app/spool
    depends_on:
      # Nur der Startreihenfolge wegen: der Worker braucht den Parser für
      # PDF und DOCX. Läuft er zuerst an, scheitert der erste Import und wird
      # wiederholt — unnötig, aber nicht schädlich.
      prowiki-parser:
        condition: service_started
    restart: unless-stopped
    # Dockers Vorgabe sind 10 Sekunden zwischen SIGTERM und SIGKILL. Ein
    # laufender Import braucht länger, und `stopBoss` wartet bis zu 50 s auf
    # laufende Jobs (jobs/queue.ts) — die Frist hier muss darüber liegen, sonst
    # war das anmutige Abschalten Zierde.
    stop_grace_period: 60s
    # Wie prowiki-app: der Worker hält die Datei-Bytes im RAM, bevor er sie an
    # den Parser gibt.
    mem_limit: 768m
    networks:
      - default
      - apps-net

  # Wartungs-Container für backend/src/scripts (Migration knora → prowiki,
  # Schema-Migration, Embedding-Backfill, Wiki-Läufe). Startet durch das Profil
  # "tools" nie im Normalbetrieb mit.
  #
  # Eigenes Image, weil das Runtime-Image nur das gebündelte dist/index.js enthält
  # — dort scheitert jedes Skript mit "Cannot find package 'drizzle-orm'".
  #
  #   docker compose --profile tools run --rm prowiki-tools bun run db:migrate
  #   docker compose --profile tools run --rm prowiki-tools \
  #     bun run src/scripts/migrate-knora.ts --source "$SOURCE_DATABASE_URL" --org "…"
  prowiki-tools:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    profiles:
      - tools
    environment:
      DATABASE_URL: postgresql://${DB_USER:?DB_USER fehlt in .env}:${DB_PASSWORD:?DB_PASSWORD fehlt in .env}@pg-shared:5432/${DB_NAME:-prowiki}
      # Nur für den einmaligen Migrationslauf gesetzt und danach wieder aus der
      # .env entfernt — sie enthält die Zugangsdaten einer fremden Datenbank.
      SOURCE_DATABASE_URL: ${SOURCE_DATABASE_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET fehlt in .env}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL fehlt in .env}
      NODE_ENV: production
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      PARSER_URL: http://prowiki-parser:8000/parse
      YOUTUBE_TRANSCRIPT_PROVIDER: ${YOUTUBE_TRANSCRIPT_PROVIDER:-}
      APIFY_API_KEY: ${APIFY_API_KEY:-}
      SUPADATA_API_KEY: ${SUPADATA_API_KEY:-}
      # Bei Massenläufen zwingend: sonst startet jede Wiki-Generierung einen
      # wiki-weiten Embedding-Sweep und hunderte davon überlagern sich.
      WIKI_EMBED_AFTER_GENERATE: "0"
      ALLOW_PLATFORM_PROVIDER: ${ALLOW_PLATFORM_PROVIDER:-0}
    mem_limit: 512m
    networks:
      - default
      - apps-net

  prowiki-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # Portblock 3121/3122 (platform/ARCHITEKTUR.md 5). Nur auf 127.0.0.1 —
      # öffentlich ist ausschließlich der Host-nginx.
      - "127.0.0.1:${FRONTEND_PORT:-3121}:80"
    depends_on:
      prowiki-app:
        condition: service_started
    restart: unless-stopped
    # Gegen die ausgelieferte SPA, nicht gegen /health — letzteres proxyt nginx an
    # prowiki-app weiter und würde hier dessen Zustand messen.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/index.html >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    # KEIN apps-net: das Frontend spricht nur mit der eigenen API im Compose-Netz
    # und ist von außen über den Host-nginx erreichbar. Wer draußen bleibt, löst
    # fremde Nachbarnamen gar nicht erst auf.
    networks:
      - default

  # Parser (MarkItDown) für PDF/DOCX/HTML. Läuft immer mit — hinter einem Profil
  # würde ihn `docker compose up -d` beim Deploy nicht starten und jeder Import
  # bräche ab.
  prowiki-parser:
    build: ./parser
    environment:
      PORT: 8000
    restart: unless-stopped
    # Im Parser-Image liegt weder curl noch wget — Python ist ohnehin da.
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # MarkItDown/pdfminer lädt das komplette PDF in den RAM. Reicht für kleine und
    # mittlere Dokumente, nicht für tausendseitige — die sprengen diese Hardware
    # unabhängig vom Deckel und müssten vorab geteilt werden.
    mem_limit: 1g
    networks:
      - default

# ACHTUNG: Hier stand in knora ein db-Service. Die Datenbank läuft seit der
# Konsolidierung als eigener Stack unter /var/www/pg-shared und bedient fünf Apps.
# Diesen Service nicht wieder aufnehmen: ein zweiter Postgres auf demselben
# Datenverzeichnis beschädigt es — lautlos.

volumes:
  # Nur Durchgangsablage für Uploads zwischen API und Worker, kein Datenspeicher.
  # Die Dateien werden nach der Verarbeitung gelöscht, Reste nach 24 Stunden
  # (backend/src/jobs/spool.ts). Ausdrücklich **nicht** im Backup nötig: was
  # zählt, steht danach in documents.content.
  prowiki-spool:

networks:
  # Das gemeinsame Netz, in dem pg-shared erreichbar ist. `external: true`, weil
  # es diesem Stack nicht gehört; ohne das legt jeder Stack ein eigenes Netz
  # gleichen Namens an und erreicht die Datenbank nicht.
  apps-net:
    external: true
